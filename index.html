        <!-- Question Section 1 -->
        <article style="margin-bottom: 36px;">
          <h2 style="font-size: 24px; color: #0F4C5C; margin-bottom: 14px; font-weight: 800;">
            What is AyuSwar AI and why was it built?
          </h2>
          <p>
            AyuSwar AI (ఆయుస్వర) is an ambient clinical voice scribe built to eliminate documentation burnout for rural doctors in Bharat by listening to doctor-patient conversations in Indic languages and automatically drafting structured ABDM FHIR clinical notes. In rural Primary Health Centers across Andhra Pradesh, Telangana, and rural India, the doctor-to-patient ratio stands at a sobering 1:1,511. A single government medical officer routinely attends to 80 to 120 patients during a four-hour outpatient morning shift, leaving less than three minutes per patient.
          </p>
          <p>
            When Electronic Health Record (EHR) initiatives mandate typed digital documentation, doctors face an agonizing tradeoff: stare into a keyboard and monitor, or look into the anxious eyes of an ailing patient. As a result, documentation becomes sparse, medication errors compound, and clinicians suffer profound digital burnout.
          </p>
          <p>
            Existing ambient scribing solutions like Nuance DAX or Ambience Healthcare are built exclusively for English-speaking hospital chains in the United States. They fail catastrophically in India because they cannot decipher rural dialects, they hallucinate when patients express symptoms through colloquial visceral metaphors, they require high-cost subscription tiers, and they send sensitive voice recordings overseas.
          </p>
          <p>
            AyuSwar AI solves this foundational national problem. Powered by Gnani.ai's production-grade Indic speech engines and open clinical standards, AyuSwar listens passively to raw doctor-patient conversations in vernacular Indian languages (Telugu, Hindi, Tamil, Kannada, Marathi, Bengali, and Indian English). It translates spoken colloquialisms into formal WHO ICD-10 and SNOMED-CT coded clinical summaries, validates drug interactions, drafts ABDM M3 FHIR R4 JSON bundles, and gives illiterate patients a spoken WhatsApp prescription card that speaks their dosage schedule in their native tongue.
          </p>
        </article>

        <!-- Question Section 3 -->
        <article style="margin-bottom: 36px;">
          <h2 style="font-size: 24px; color: #0F4C5C; margin-bottom: 14px; font-weight: 800;">
            What are the four pillars of AyuSwar's sovereign voice architecture?
          </h2>
          <p>
            AyuSwar AI is built on four sovereign architectural pillars: 48kHz acoustic signal processing, Gnani Indic voice engines, deterministic clinical safeguards, and zero-data-leakage ABDM M3 compliance.
          </p>
          
          <div style="margin-top: 16px;">
            <h3 style="font-size: 18px; color: #081C24; font-weight: 750; margin-bottom: 6px;">
              1. High-Fidelity Acoustic Digital Signal Processing (DSP)
            </h3>
            <p style="margin-bottom: 16px;">
              AyuSwar operates a 48kHz audio capture pipeline utilizing 2048-point Fast Fourier Transforms (FFT) with physical tone precision within ±2Hz. Dual-channel WebRTC audio isolates physician and patient speech streams, performing real-time Voice Activity Detection (VAD) and signal-to-noise ratio (SNR) estimation to prevent transcription drift in noisy rural clinic environments.
            </p>

            <h3 style="font-size: 18px; color: #081C24; font-weight: 750; margin-bottom: 6px;">
              2. Gnani.ai Indic Voice Infrastructure (Prisma v3 & Timbre)
            </h3>
            <p style="margin-bottom: 16px;">
              Leveraging Gnani's enterprise-grade speech models, AyuSwar supports real-time automated speech recognition (ASR) via Prisma v3 across major Indian language families: Telugu, Hindi, Tamil, Kannada, Marathi, Bengali, and Indian English. Synthesis via Gnani Timbre delivers warm, natural vernacular cadence calibrated for patient reassurance and clear clinical comprehension.
            </p>

            <h3 style="font-size: 18px; color: #081C24; font-weight: 750; margin-bottom: 6px;">
              3. Deterministic Clinical Safety Sentinel (Zero Hallucination)
            </h3>
            <p style="margin-bottom: 16px;">
              Medical documentation permits zero hallucination tolerance. AyuSwar isolates conversational LLM reasoning (Gnani Evon 30B / DeepSeek / Ollama Local) behind deterministic clinical guards. Every extracted symptom, medication, and dosage must match verified SNOMED-CT clinical ontologies and Jan Aushadhi pharmacopeia tables before it can populate an official record.
            </p>

            <h3 style="font-size: 18px; color: #081C24; font-weight: 750; margin-bottom: 6px;">
              4. ABDM M3 & DPDP Act 2023 Sovereignty (HL7 FHIR R4 Bundles)
            </h3>
            <p style="margin-bottom: 16px;">
              In this prototype, audio is processed in volatile memory and purged once structured draft notes are generated (no audio retained on disk); structured drafts may persist locally on device for the offline workflow. The output is HL7 FHIR R4-shaped, aligned to Ayushman Bharat Digital Mission milestone formats (prototype, not certified), and every note requires clinician review in the demo workflow.
            </p>
          </div>
        </article>
